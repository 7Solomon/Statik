[project]
name = "statik-mcp"
version = "0.1.0"
description = "MCP server for the Statik structural analysis editor"
requires-python = ">=3.10"
dependencies = [
    # FastMCP was renamed to MCPServer in 2.x; this server uses the 2.x names.
    "mcp>=2.0,<3",
    "httpx>=0.27",
]

[project.scripts]
statik-mcp = "statik_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["statik_mcp"]
