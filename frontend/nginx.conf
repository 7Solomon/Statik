worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  sendfile on;
  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # React SPA fallback
    location / {
      try_files $uri /index.html;
    }

    # Proxy API requests to Flask/Gunicorn.
    # Der Name muss "statik-backend" heissen, nicht "backend": dieser
    # Container haengt auch im gemeinsamen edge-Netz des Servers, und dort
    # gibt es bereits einen anderen Dienst namens "backend" (ToSearch).
    # Docker fragt alle Netze ab - "backend" landete dort und nicht hier.
    location /api/ {
      proxy_pass http://statik-backend:8000;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Long-lived cache for hashed assets
    location ~* \.(?:css|js|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
      expires 1y;
      add_header Cache-Control "public, immutable";
    }
  }
}